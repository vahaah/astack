name: Signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.13.1
      - run: bun install --frozen-lockfile
      - name: Verify the signed tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release.ts
      - run: bun run check:drift
      - run: bun run check
      - run: bun run check:drift
      - run: git diff --exit-code

  draft:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Verify the tag again before the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release.ts
      - name: Create the owner review draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${GITHUB_REF#refs/tags/}"
          gh release create "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "$release_tag" \
            --notes "Draft from the verified signed tag. Review the tag, checks, and files before publication."
